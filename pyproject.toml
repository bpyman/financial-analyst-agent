[project]
name = "financial-analyst-agent"
version = "0.1.0"
description = "Financial analyst agent POC"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
build-universe-snapshot = "financial_analyst_agent.snapshot_builder:main"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_analyst_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/financial_analyst_agent/data/universe_snapshot.json" = "financial_analyst_agent/data/universe_snapshot.json"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["financial_analyst_agent"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-m 'not network'"
markers = [
    "network: tests that require live network access",
]
