name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run python -m mypy
      - name: Pytest
        run: uv run python -m pytest -q
      - name: Gold
        run: uv run python -m pytest -m gold -q

  # The API image a host deploys: build it, then run it and take one recorded turn.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --tag financial-analyst-api:ci .
      - name: Smoke test
        run: python3 scripts/smoke_api_image.py --image financial-analyst-api:ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # After the build, which writes next-env.d.ts and the route types.
      - name: Typecheck
        run: npx tsc --noEmit
      # The browser check starts the Python API on the recorded runtime.
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: .
        run: uv sync
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser check
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
