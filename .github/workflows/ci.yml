name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run python -m mypy
      - name: Pytest
        run: uv run python -m pytest -q
      - name: Gold
        run: uv run python -m pytest -m gold -q

  # The API image a host deploys: build it, then run it and take one recorded turn.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --tag financial-analyst-api:ci .
      - name: Smoke test
        run: python3 scripts/smoke_api_image.py --image financial-analyst-api:ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # After the build, which writes next-env.d.ts and the route types.
      - name: Typecheck
        run: npx tsc --noEmit
      # The browser check starts the Python API on the recorded runtime.
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: .
        run: uv sync
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser check
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Production deploys wait for CI (ADR 0006 "Hosting"; docs/deploy.md).
  # web/vercel.json turns off Vercel's Git deploys of master, so the window
  # reaches production only through VERCEL_DEPLOY_HOOK_URL, called here once
  # every other job passes. RENDER_DEPLOY_HOOK_URL is the fallback for Render's
  # own "deploy after checks pass" (render.yaml autoDeployTrigger: checksPass);
  # set autoDeployTrigger to off with it so a commit is not deployed twice. Each
  # hook is skipped while its repository secret is unset. Render goes first, so
  # the API is ahead of a window that depends on it.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [check, image, web]
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      # A deploy hook builds the branch's latest commit, not a given one. If
      # master has moved on, a hook call now would ship a commit CI has not
      # passed; that commit's own run deploys it once its checks pass.
      - name: Check this commit is still the tip of master
        id: tip
        if: env.RENDER_DEPLOY_HOOK_URL != '' || env.VERCEL_DEPLOY_HOOK_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "master is at $tip, not $GITHUB_SHA: its own CI run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Call the Render deploy hook
        if: steps.tip.outputs.current == 'true' && env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --output /dev/null --request POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Call the Vercel deploy hook
        if: steps.tip.outputs.current == 'true' && env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --output /dev/null --request POST "$VERCEL_DEPLOY_HOOK_URL"
      - name: No deploy hook set
        if: env.RENDER_DEPLOY_HOOK_URL == '' && env.VERCEL_DEPLOY_HOOK_URL == ''
        run: echo "No deploy hook secret is set. Render deploys on its own after checks pass; Vercel production does not deploy until VERCEL_DEPLOY_HOOK_URL is set."
