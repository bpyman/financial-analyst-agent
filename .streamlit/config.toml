[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

# The dark palette of the new window (web/app/globals.css, .dark).
[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#07080a"
secondaryBackgroundColor = "#0e1014"
textColor = "#e8eaed"
borderColor = "#20242b"
